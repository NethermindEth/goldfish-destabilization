</defs><g font-family="DejaVu Sans, sans-serif" fill="#333333" font-size="15">
<path d="M120 40 L120 200" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="120" y="225" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold">GST</text>
<path d="M360 40 L360 200" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="360" y="225" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold">GST+L</text>
