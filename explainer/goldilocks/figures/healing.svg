<text x="600" y="225" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold">GST+2L</text>
<rect x="30" y="60" width="250" height="18" rx="3" fill="#faeeeb" stroke="#b03a2e" stroke-width="1.5"/>
<text x="36" y="74.0" text-anchor="start" font-size="11.5" fill="#b03a2e" font-weight="bold">B · fast (pre-GST)</text>
<rect x="60" y="90" width="220" height="18" rx="3" fill="#faeeeb" stroke="#b03a2e" stroke-width="1.5"/>
<text x="66" y="104.0" text-anchor="start" font-size="11.5" fill="#b03a2e" font-weight="bold">B′ · fast, conflicts with B</text>
<rect x="200" y="120" width="290" height="18" rx="3" fill="#fbf3df" stroke="#b07d00" stroke-width="1.5"/>
<text x="206" y="134.0" text-anchor="start" font-size="11.5" fill="#b07d00" font-weight="bold">C · slow, formed across GST</text>
<rect x="380" y="150" width="260" height="18" rx="3" fill="#e9f3f0" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="386" y="164.0" text-anchor="start" font-size="11.5" fill="#1f7a6d" font-weight="bold">formed fully after GST: followed</text>
<text x="130" y="32" text-anchor="start" font-size="12" fill="#333333">1 · no new conflicting locks</text>
<text x="370" y="32" text-anchor="start" font-size="12" fill="#333333">2 · post-GST locks followed</text>
<text x="610" y="32" text-anchor="start" font-size="12" fill="#333333">3 · healed</text>
<text x="30" y="245.0" text-anchor="start" font-size="11.5" fill="#777777">L = lock lifetime (k slots). Then the next honest proposal is confirmed by all: AC heals by GST + 2L + G.</text>
