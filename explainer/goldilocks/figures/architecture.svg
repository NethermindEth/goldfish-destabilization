<text x="36" y="182" text-anchor="start" font-size="13" fill="#333333">state Σ: block tree T, chain states σ[B],</text>
<text x="36" y="200" text-anchor="start" font-size="13" fill="#333333">F, J, h_j, h_max, attestation pool</text>
<text x="36" y="226" text-anchor="start" font-size="13" fill="#333333">accepts blocks, justifies and finalizes,</text>
<text x="36" y="244" text-anchor="start" font-size="13" fill="#333333">owns the validator client (record Λ)</text>
<rect x="440" y="130" width="300" height="150" rx="3" fill="#e9f3f0" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="456" y="156" text-anchor="start" font-size="16" fill="#1f7a6d" font-weight="bold">Available chain (AC): Goldilocks</text>
<text x="456" y="182" text-anchor="start" font-size="13" fill="#333333">state A: Goldfish votes, timestamps,</text>
<text x="456" y="200" text-anchor="start" font-size="13" fill="#333333">saved confirmations, locks, record</text>
<text x="456" y="226" text-anchor="start" font-size="13" fill="#333333">head, confirmation, locks; no block store:</text>
<text x="456" y="244" text-anchor="start" font-size="13" fill="#333333">sees blocks only through the frame Φ</text>
