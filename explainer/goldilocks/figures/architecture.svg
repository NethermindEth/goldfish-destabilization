<text x="40" y="48" text-anchor="start" font-size="16" fill="#333333" font-weight="bold">Node</text>
<text x="40" y="72" text-anchor="start" font-size="13" fill="#777777">keeps the clock and both states; runs on_tick, on_block, on_ac_message, on_attestation; duties</text>
<rect x="20" y="130" width="300" height="150" rx="3" fill="#eaf1f8" stroke="#1d5f9e" stroke-width="1.5"/>
