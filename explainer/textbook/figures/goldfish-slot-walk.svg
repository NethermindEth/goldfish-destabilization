<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350">
<title>Slot 12 head selection uses only slot 11 votes</title>
<rect width="760" height="350" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#777777"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333333">
<text x="15" y="25" fill="#333333" font-size="17" text-anchor="start" font-weight="bold">CURRENT SLOT 12  ·  COUNT VOTES CAST IN SLOT 11 ONLY</text>
<text x="15" y="51" fill="#333333" font-size="16" text-anchor="start">100 participating seats → every older child must have more than 50.</text>
<path d="M89 128 L201 128" stroke="#777777" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M259 128 L401 128" stroke="#777777" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M459 128 L621 128" stroke="#777777" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M252 147 L401 246" stroke="#777777" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="31" y="106" width="58" height="44" rx="3" fill="#e9f3f0" stroke="#1f7a6d" stroke-width="2"/>
<text x="60" y="134" fill="#1f7a6d" font-size="18" text-anchor="middle" font-weight="bold">F</text>
<text x="60" y="173" fill="#1d5f9e" font-size="15" text-anchor="middle">Block slot 6</text>
<rect x="201" y="106" width="58" height="44" rx="3" fill="#e9f3f0" stroke="#1f7a6d" stroke-width="2"/>
<text x="230" y="134" fill="#1f7a6d" font-size="18" text-anchor="middle" font-weight="bold">A</text>
<text x="230" y="173" fill="#1d5f9e" font-size="15" text-anchor="middle">Block slot 7</text>
<text x="230" y="196" fill="#1f7a6d" font-size="16" text-anchor="middle" font-weight="bold">Score 100</text>
<rect x="401" y="106" width="58" height="44" rx="3" fill="#e9f3f0" stroke="#1f7a6d" stroke-width="2"/>
<text x="430" y="134" fill="#1f7a6d" font-size="18" text-anchor="middle" font-weight="bold">B</text>
<text x="430" y="173" fill="#1d5f9e" font-size="15" text-anchor="middle">Block slot 8</text>
<text x="430" y="196" fill="#1f7a6d" font-size="16" text-anchor="middle" font-weight="bold">Score 65</text>
<rect x="621" y="106" width="58" height="44" rx="3" fill="white" stroke="#777777" stroke-width="2"/>
<text x="650" y="134" fill="#777777" font-size="18" text-anchor="middle" font-weight="bold">C</text>
<text x="650" y="173" fill="#1d5f9e" font-size="15" text-anchor="middle">Block slot 10</text>
<text x="650" y="196" fill="#1f7a6d" font-size="16" text-anchor="middle" font-weight="bold">Score 40</text>
<rect x="401" y="224" width="58" height="44" rx="3" fill="white" stroke="#777777" stroke-width="2"/>
<text x="430" y="252" fill="#777777" font-size="18" text-anchor="middle" font-weight="bold">D</text>
<text x="430" y="291" fill="#1d5f9e" font-size="15" text-anchor="middle">Block slot 9</text>
<text x="430" y="314" fill="#1f7a6d" font-size="16" text-anchor="middle" font-weight="bold">Score 35</text>
<text x="430" y="94" fill="#1f7a6d" font-size="16" text-anchor="middle">25 seats name B</text>
<text x="650" y="94" fill="#1f7a6d" font-size="16" text-anchor="middle">40 seats name C</text>
<text x="485" y="252" fill="#1f7a6d" font-size="16" text-anchor="start">35 seats name D</text>
<text x="15" y="255" fill="#1f7a6d" font-size="17" text-anchor="start" font-weight="bold">Walk: F → A → B</text>
<text x="15" y="282" fill="#333333" font-size="16" text-anchor="start">Stop at B: C has 40 ≤ 50.</text>
<text x="15" y="335" fill="#333333" font-size="16" text-anchor="start">Block age identifies a vertex; vote age decides whether its evidence counts.</text>
</g></svg>