<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-label="Availability can split while full-set progress waits">
<title>Availability can split while full-set progress waits</title>
<rect width="760" height="100%" fill="white"/>
<defs>
<marker id="a1f7a6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a6d"/></marker>
<marker id="a6a3d9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a3d9a"/></marker>
<marker id="ac4661f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4661f"/></marker>
<marker id="a1d5f9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5f9e"/></marker>
<marker id="ab03a2e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03a2e"/></marker>
<marker id="a333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker>
<marker id="a777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#777777"/></marker>
</defs><g font-family="DejaVu Sans, sans-serif" fill="#333333" font-size="16">
<text x="20" y="27" text-anchor="start" font-size="18" fill="#333333" font-weight="bold">64 equal-balance validators; fixed full-set quorum q = 43</text>
<rect x="20" y="48" width="343" height="130" rx="3" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="35" y="77" text-anchor="start" font-size="18" fill="#777777" font-weight="bold">32 / 32 partition</text>
<rect x="68.0" y="92" width="64" height="44" rx="3" fill="white" stroke="#777777" stroke-width="1.5"/>
<text x="100" y="120" text-anchor="middle" font-size="18" fill="#777777" font-weight="bold">32</text>
<rect x="245.0" y="92" width="64" height="44" rx="3" fill="white" stroke="#777777" stroke-width="1.5"/>
<text x="277" y="120" text-anchor="middle" font-size="18" fill="#777777" font-weight="bold">32</text>
<text x="36" y="162" text-anchor="start" font-size="16" fill="#777777">Neither side alone reaches 43.</text>
<rect x="397" y="48" width="343" height="130" rx="3" fill="#eaf1f8" stroke="#1d5f9e" stroke-width="1.5"/>
<text x="412" y="77" text-anchor="start" font-size="18" fill="#1d5f9e" font-weight="bold">48 / 16 partition</text>
<rect x="446.0" y="92" width="64" height="44" rx="3" fill="white" stroke="#1d5f9e" stroke-width="1.5"/>
<text x="478" y="120" text-anchor="middle" font-size="18" fill="#1d5f9e" font-weight="bold">48</text>
<rect x="622.0" y="92" width="64" height="44" rx="3" fill="white" stroke="#777777" stroke-width="1.5"/>
<text x="654" y="120" text-anchor="middle" font-size="18" fill="#777777" font-weight="bold">16</text>
<text x="412" y="162" text-anchor="start" font-size="16" fill="#1d5f9e">48 can form a quorum if eligible.</text>
<text x="20" y="213" text-anchor="start" font-size="16" fill="#1f7a6d">Committee-level available suffixes may diverge on both sides.</text>
<path d="M380 228 L380 260" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#a777777)"/>
<text x="380" y="287" text-anchor="middle" font-size="18" fill="#333333" font-weight="bold">Communication resumes</text>
<path d="M80 319 L680 319" fill="none" stroke="#777777" stroke-width="2"/>
<circle cx="80" cy="319" r="6" fill="#1f7a6d"/>
<text x="80" y="348" text-anchor="middle" font-size="16" fill="#1f7a6d" font-weight="bold">Evidence</text>
<circle cx="280" cy="319" r="6" fill="#6a3d9a"/>
<text x="280" y="348" text-anchor="middle" font-size="16" fill="#6a3d9a" font-weight="bold">Live views</text>
<circle cx="480" cy="319" r="6" fill="#c4661f"/>
<text x="480" y="348" text-anchor="middle" font-size="16" fill="#c4661f" font-weight="bold">TSQ round</text>
<circle cx="680" cy="319" r="6" fill="#1d5f9e"/>
<text x="680" y="348" text-anchor="middle" font-size="16" fill="#1d5f9e" font-weight="bold">Finality</text>
<text x="20" y="386" text-anchor="start" font-size="16" fill="#333333">Conditional path: common dependencies, compatible floors / committees,</text>
<text x="20" y="411" text-anchor="start" font-size="16" fill="#333333">usable confirmation, timely proposer relay, and eligible included votes.</text>
<text x="20" y="442" text-anchor="start" font-size="16" fill="#b03a2e" font-weight="bold">Restored delivery alone does not prove convergence or a healing bound.</text>
</g></svg>