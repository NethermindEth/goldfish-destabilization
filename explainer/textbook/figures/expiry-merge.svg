<text x="335" y="277" text-anchor="start" font-size="16" fill="#c4661f">Next proposer keeps collecting</text>
<text x="35" y="326" text-anchor="start" font-size="16" fill="#333333">Next proposal carries votes → receivers merge evidence before voting.</text>
</g></svg>