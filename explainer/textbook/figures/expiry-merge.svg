<text x="30" y="128" text-anchor="start" font-size="16" fill="#777777">Ignored on entry to s</text>
<path d="M30 137 L220 137" fill="none" stroke="#b03a2e" stroke-width="2"/>
<text x="278" y="103" text-anchor="start" font-size="17" fill="#1f7a6d" font-weight="bold">Score with votes s−1</text>
<text x="278" y="128" text-anchor="start" font-size="16" fill="#333333">Fresh committee view</text>
<text x="523" y="103" text-anchor="start" font-size="17" fill="#c4661f" font-weight="bold">Score with votes s</text>
<text x="523" y="128" text-anchor="start" font-size="16" fill="#333333">Not accumulated history</text>
<path d="M30 186 L730 186" fill="none" stroke="#777777" stroke-width="2"/>
<path d="M45 178 L45 194" fill="none" stroke="#777777" stroke-width="2"/>
<text x="45" y="219" text-anchor="start" font-size="15" fill="#777777">25%: vote</text>
<path d="M310 178 L310 194" fill="none" stroke="#777777" stroke-width="2"/>
<text x="310" y="219" text-anchor="middle" font-size="15" fill="#777777">75%: cutoff</text>
<path d="M630 178 L630 194" fill="none" stroke="#777777" stroke-width="2"/>
<text x="630" y="219" text-anchor="middle" font-size="15" fill="#777777">0%: proposal</text>
