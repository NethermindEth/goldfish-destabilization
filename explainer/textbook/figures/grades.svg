</defs><g font-family="DejaVu Sans, sans-serif" fill="#333333" font-size="16">
<path d="M100 125 L270 75" fill="none" stroke="#1f7a6d" stroke-width="2" marker-end="url(#a1f7a6d)"/>
<path d="M100 125 L270 235" fill="none" stroke="#b03a2e" stroke-width="2" marker-end="url(#ab03a2e)"/>
<rect x="38.0" y="103" width="64" height="44" rx="3" fill="white" stroke="#1d5f9e" stroke-width="1.5"/>
<text x="70" y="131" text-anchor="middle" font-size="18" fill="#1d5f9e" font-weight="bold">F</text>
<rect x="268.0" y="53" width="64" height="44" rx="3" fill="white" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="300" y="81" text-anchor="middle" font-size="18" fill="#1f7a6d" font-weight="bold">A</text>
<text x="300" y="122" text-anchor="middle" font-size="16" fill="#1f7a6d">40 / 60</text>
<rect x="268.0" y="213" width="64" height="44" rx="3" fill="white" stroke="#b03a2e" stroke-width="1.5"/>
<text x="300" y="241" text-anchor="middle" font-size="18" fill="#b03a2e" font-weight="bold">B</text>
<text x="300" y="282" text-anchor="middle" font-size="16" fill="#b03a2e">20 / 60</text>
<text x="420" y="55" text-anchor="start" font-size="19" fill="#1f7a6d" font-weight="bold">G1 enters A</text>
<text x="420" y="85" text-anchor="start" font-size="16" fill="#333333">3 × 40 ≥ 2 × 60</text>
<text x="420" y="114" text-anchor="start" font-size="16" fill="#333333">Exactly two thirds is enough.</text>
<text x="420" y="205" text-anchor="start" font-size="19" fill="#b03a2e" font-weight="bold">A is NOT G0-clear</text>
<text x="420" y="235" text-anchor="start" font-size="16" fill="#333333">Conflicting B: 3 × 20 = 60</text>
<text x="420" y="264" text-anchor="start" font-size="16" fill="#333333">One-third opposition vetoes.</text>
<text x="22" y="308" text-anchor="start" font-size="16" fill="#777777">D = 60 is usable live head weight, not automatically all active stake.</text>
</g></svg>